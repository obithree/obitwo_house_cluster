---
# Ollama のデフォルト設定

# インストール設定
ollama_install_dir: /usr/local/bin
ollama_data_dir: /usr/share/ollama

# サービス設定
ollama_host: "0.0.0.0"  # 外部からアクセスさせる場合は "0.0.0.0" に変更
ollama_port: 11434
ollama_service_user: ollama

# GPU設定 (auto: 自動検出, cpu: CPU のみ, nvidia: NVIDIA GPU 強制使用)
ollama_gpu_mode: "auto"

# インストール後に自動でダウンロードするモデル（空リストならスキップ）
# 例: ["llama3", "gemma3:4b"]
ollama_models:
  - gemma4:12b
  - qwen3.6:27b
  - qwen3.6:35b-a3b-mtp-q4_K_M
