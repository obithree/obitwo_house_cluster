---
- name: Ubuntu PCのセットアップ
  hosts: localhost
  become: yes
  roles:
    - common
    - role: pc
      vars:
        install_dev_tools: true  # 開発ツールをインストールする場合はtrue、不要な場合はfalseまたは削除
        set_nvidia_power_limit: true
        nvidia_power_limit_w: 250
    - role: ollama
      vars:
        ollama_host: "127.0.0.1"   # 外部公開する場合は "0.0.0.0" に変更
        ollama_models: []           # 例: ["llama3", "gemma3:4b"]
