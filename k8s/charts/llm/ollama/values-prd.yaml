replicaCount: 1

image:
  tag: "latest"

service:
  type: ClusterIP

persistence:
  size: 50Gi

resources:
  requests:
    memory: "8Gi"
    cpu: "4000m"
    gpu: "2"
  limits:
    memory: "24Gi"
    cpu: "16000m"
    gpu: "2"

gpu:
  enabled: true

env:
  - name: OLLAMA_NUM_PARALLEL
    value: "2"
  - name: OLLAMA_MAX_LOADED_MODELS
    value: "2"
  - name: OLLAMA_FLASH_ATTENTION
    value: "1"
  - name: OLLAMA_KV_CACHE_TYPE
    value: "q8_0"

models:
  - gemma3:4b
  - qwen3.6:27b
  - gemma4:26b-a4b-it-q4_K_M
  - qwen3.6:35b-a3b-mtp-q4_K_M

ingress:
  enabled: true
  className: tailscale
  annotations:
    tailscale.com/hostname: "ollama"
    tailscale.com/proxy-group: "ingress-proxies"
